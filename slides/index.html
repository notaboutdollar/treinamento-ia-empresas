ondentes e citada 12 vezes como melhor pagamento, mas não é a principal de nenhum.</p></div><div><b>79%</b><h5>Pix como padrão</h5><p>A preferência por Pix em reais é dominante; apenas 2 respondentes preferem criptomoedas.</p></div><div><b>44%</b><h5>Visibilidade do processamento</h5><p>Atraso na exibição dos vídeos e dificuldade de acompanhar o status (22%) são os principais problemas técnicos.</p></div><div><b>79%</b><h5>Base recente e volátil</h5><p>A maioria atua há até 3 meses e 65 utilizam três ou mais plataformas, o que reduz o custo de troca.</p></div></div>"}, {"id": "recomendacoes", "sec": "Recomendações", "t": "Recomenda-se priorizar seis frentes, em ordem de impacto declarado pelos gravadores", "h": "<table class=\"rt\"><thead><tr><th>#</th><th>Frente</th><th>Racional</th></tr></thead><tbody><tr><td>1</td><td>Pagamento previsível em Pix</td><td>Calendário fixo de pagamentos, saque mínimo reduzido e Pix em reais endereçam as três principais queixas financeiras.</td></tr><tr><td>2</td><td>Transparência operacional</td><td>Status em tempo real do envio, da fila de análise e das horas aprovadas.</td></tr><tr><td>3</td><td>Oferta contínua de tarefas</td><td>Preservar as tarefas domésticas (93%) e com bônus (78%) e ampliar o catálogo.</td></tr><tr><td>4</td><td>Rejeições justificadas</td><td>26% reclamam de rejeições sem motivo claro; feedback objetivo reduz retrabalho.</td></tr><tr><td>5</td><td>Compatibilidade de dispositivos</td><td>24 respondentes pedem suporte a mais modelos de celular, uma barreira de entrada.</td></tr><tr><td>6</td><td>Estabilidade do valor/hora</td><td>Critério nº 1 de escolha (85%); mudanças devem ser comunicadas com antecedência.</td></tr></tbody></table>"}], "U": {"src": "Fonte: pesquisa Treinadores de IA, n=97, out/2026", "cr": "Elaborado por <a href=\"https://x.com/notaboutdollar\" target=\"_blank\" rel=\"noopener\">Dollar</a> · com apoio do Grok Bot", "title": "Plataformas de treinamento de IA no Brasil", "sub": "Percepção dos gravadores de conteúdo sobre remuneração, operação, pagamentos e suporte", "kick": "Estudo setorial · Outubro de 2026", "prep": "Preparado para", "date": "Data", "datev": "Outubro de 2026", "base": "Base", "basev": "97 respondentes, 8 plataformas", "auth": "Autores", "close": "Encerramento", "closet": "Plataformas que pagam com previsibilidade e dão visibilidade ao processo retêm os gravadores", "closes": "Plataformas de treinamento de IA no Brasil · Preparado para Invent Money · Outubro de 2026", "home": "Início", "index": "Índice", "back": "Voltar ao início", "cover": "Capa", "toslides": "Ver como apresentação", "toreport": "Ver relatório", "top": "Topo", "pagetitle": "Plataformas de treinamento de IA no Brasil — Estudo setorial, outubro de 2026", "read": "Ler o relatório"}}, "en": {"X": [{"id": "resumo", "sec": "Executive summary", "t": "Pay determines which platform recorders choose; payment predictability determines whether they stay", "h": "<div class=\"kp\"><div><b>51%</b><span>use Hub.xyz as their main platform</span></div><div><b>68%</b><span>report payment delays</span></div><div><b>79%</b><span>prefer to be paid via Pix in reais</span></div><div><b>85%</b><span>choose tasks based on hourly pay</span></div></div><ol class=\"pts\"><li><b>A concentrated market.</b> Hub.xyz is the main platform for 49 of 97 respondents; Claru.ai ranks second with 21 (22%).</li><li><b>Payment is the main source of friction.</b> 68% report delays and 37% consider the minimum withdrawal too high.</li><li><b>Insufficient task supply.</b> 57% cite limited task availability as their main difficulty.</li><li><b>Stated priorities.</b> Higher pay (86%) and more tasks (75%).</li></ol>"}, {"id": "metodo", "sec": "Methodology", "t": "The sample consists mostly of recent, multi-platform recorders", "h": "<div class=\"g2\"><div><h4>Time working as a recorder</h4><div class=\"bc\"><div class=\"bl\"><span class=\"lb\">Less than 1 month</span><span class=\"tr\"><i style=\"width:48.1%\"></i></sp pan><span class=\"tr\"><i style=\"width:17.1%\"></i></span><span class=\"vl\">14%<small> (14)</small></span></div><div class=\"bl\"><span class=\"lb\">Clarity of instructions</span><span class=\"tr\"><i style=\"width:13.4%\"></i></span><span class=\"vl\">11%<small> (11)</small></span></div></div></div></div>"}, {"id": "operacao", "sec": "Operations", "t": "Task scarcity and poor processing visibility are the main operational pain points", "h": "<div class=\"g2\"><div><h4>Main difficulty with tasks</h4><div class=\"bc\"><div class=\"bl hi\"><span class=\"lb\">Few tasks available</span><span class=\"tr\"><i style=\"width:100.0%\"></i></span><span class=\"vl\">57%<small> (55)</small></span></div><div class=\"bl\"><span class=\"lb\">Low pay relative to effort</span><span class=\"tr\"><i style=\"width:65.5%\"></i></span><span class=\"vl\">37%<small> (36)</small></span></div><div class=\"bl\"><span class=\"lb\">Rejections without clear explanation</span><span class=\"tr\"><i style=\"width:45.5%\"></i></span><span class=\"vl\">26%<small> (25)</small></span></div><div class=\"bl\"><span class=\"lb\">Confusing instructions</span><span class=\"tr\"><i style=\"width:36.4%\"></i></span><span class=\"vl\">21%<small> (20)</small></span></div><div class=\"bl\"><span class=\"lb\">No significant difficulties</span><span class=\"tr\"><i style=\"width:25.5%\"></i></span><span class=\"vl\">14%<small> (14)</small></span></div><div class=\"bl\"><span class=\"lb\">Overly strict technical requirements</span><span class=\"tr\"><i style=\"width:21.8%\"></i></span><span class=\"vl\">12%<small> (12)</small></span></div><div class=\"bl\"><span class=\"lb\">Difficulty meeting required duration</span><span class=\"tr\"><i style=\"width:16.4%\"></i></span><span class=\"vl\">9%<small> (9)</small></span></div><div class=\"bl\"><span class=\"lb\">Difficulty tracking approved hours</span><span class=\"tr\"><i style=\"width:12.7%\"></i></span><span class=\"vl\">7%<small> (7)</small></span></div></div></div><div><h4>Most frequent technical problems</h4><div class=\"bc\"><div class=\"bl hi\"><span class=\"lb\">Delay before videos appear in the system</span><span class=\"tr\"><i style=\"width:100.0%\"></i></span><span class=\"vl\">44%<small> (43)</small></span></div><div class=\"bl\"><span class=\"lb\">No technical problems</span><span class=\"tr\"><i style=\"width:55.8%\"></i></span><span class=\"vl\">25%<small> (24)</small></span></div><div class=\"bl\"><span class=\"lb\">Difficulty tracking recording status</span><span class=\"tr\"><i style=\"width:48.8%\"></i></span><span class=\"vl\">22%<small> (21)</small></span></div><div class=\"bl\"><span class=\"lb\">Crashes or slowness</span><span class=\"tr\"><i style=\"width:32.6%\"></i></span><span class=\"vl\">14%<small> (14)</small></span></div><div class=\"bl\"><span class=\"lb\">Upload errors</span><span class=\"tr\"><i style=\"width:25.6%\"></i></span><span class=\"vl\">11%<small> (11)</small></span></div><div class=\"bl\"><span class=\"lb\">Difficulty accessing or finding tasks</span><span class=\"tr\"><i style=\"width:25.6%\"></i></span><span class=\"vl\">11%<small> (11)</small></span></div><div class=\"bl\"><span class=\"lb\">Phone incompatibility</span><span class=\"tr\"><i style=\"width:23.3%\"></i></span><span class=\"vl\">10%<small> (10)</small></span></div><div class=\"bl\"><span class=\"lb\">Failures during recording</span><span class=\"tr\"><i style=\"width:18.6%\"></i></span><span class=\"vl\">8%<small> (8)</small></span></div></div></div></div>"}, {"id": "pagamentos", "sec": "Payments", "t": "Trust in a platform is built at the point of withdrawal", "h": "<div class=\"g2\"><div><h4>Payment difficulties</h4><div class=\"bc\"><div class=\"bl hi\"><span class=\"lb\">Payment delays</span><span class=\"tr\"><i style=\"width:100.0%\"></i></span><span class=\"vl\">68%<small> (66)</small></span></div><div class=\"bl\"><span class=\"lb\">Minimum withdrawal too high</span><span class=\"tr\"><i style=\"width:54.5%\"></i></span><span class=\"vl\">37%<small> (36)</small></span></div><div class=\"bl\"><span class=\"lb\">Difficulty requesting withdrawals</span><span class=\"tr\"><i style=\"width:30.3%\"></i></span><span class=\"vl\">21%<small> (20)</small></span></div><div class=\"bl\"><span class=\"lb\">Unclear amounts and dates</span><span class=\"tr\"><i style=\"width:30.3%\"></i></span><span class=\"vl\">21%<small> (20)</small></span></div><div class=\"bl\"><span class=\"lb\">Not yet paid</span><span class=\"tr\"><i style=\"width:13.6%\"></i></span><span class=\"vl\">9%<small> (9)</small></span></div><div class=\"bl\"><span class=\"lb\">Never had problems</span><span class=\"tr\"><i style=\"width:13.6%\"></i></span><span class=\"vl\">9%<small> (9)</small></span></div><div class=\"bl\"><span class=\"lb\">High fees or costs</span><span class=\"tr\"><i style=\"width:9.1%\"></i></span><span class=\"vl\">6%<small> (6)</small></span></div><div class=\"bl\"><span class=\"lb\">Amount received differed from expected</span><span class=\"tr\"><i style=\"width:7.6%\"></i></span><span class=\"vl\">5%<small> (5)</small></span></div></div></div><div><h4>Preferred payment method</h4><div class=\"bc\"><div class=\"bl hi\"><span class=\"lb\">Pix, directly in reais</span><span class=\"tr\"><i style=\"width:100.0%\"></i></span><span class=\"vl\">79%<small> (77)</small></span></div><div class=\"bl\"><span class=\"lb\">Indifferent, if reliable and easy to withdraw</span><span class=\"tr\"><i style=\"width:16.9%\"></i></span><span class=\"vl\">13%<small> (13)</small></span></div><div class=\"bl\"><span class=\"lb\">PayPal</span><span class=\"tr\"><i style=\"width:3.9%\"></i></span><span class=\"vl\">3%<small> (3)</small></span></div><div class=\"bl\"><span class=\"lb\">Bank transfer</span><span class=\"tr\"><i style=\"width:2.6%\"></i></span><span class=\"vl\">2%<small> (2)</small></span></div><div class=\"bl\"><span class=\"lb\">Cryptocurrency (USDT, USDC, etc.)</span><span class=\"tr\"><i style=\"width:2.6%\"></i></span><span class=\"vl\">2%<small> (2)</small></span></div></div></div></div>"}, {"id": "prioridades", "sec": "Priorities", "t": "Pay and task volume are the most requested improvements, followed by faster approval", "h": "<h4>Improvements rated most important (up to 3)</h4><div class=\"bc\"><div class=\"bl hi\"><span class=\"lb\">Increase pay for recordings</span><span class=\"tr\"><i style=\"width:100.0%\"></i></span><span class=\"vl\">86%<small> (83)</small></span></div><div class=\"bl hi\"><span class=\"lb\">Offer more tasks</span><span class=\"tr\"><i style=\"width:88.0%\"></i></span><span class=\"vl\">75%<small> (73)</small></span></div><div class=\"bl\"><span class=\"lb\">Speed up video review and approval</span><span class=\"tr\"><i style=\"width:43.4%\"></i></span><span class=\"vl\">37%<small> (36)</small></span></div><div class=\"bl\"><span class=\"lb\">Improve support and service</span><span class=\"tr\"><i style=\"width:37.3%\"></i></span><span class=\"vl\">32%<small> (31)</small></span></div><div class=\"bl\"><span class=\"lb\">Better explain rejection reasons</span><span class=\"tr\"><i style=\"width:32.5%\"></i></span><span class=\"vl\">28%<small> (27)</small></span></div><div class=\"bl\"><span class=\"lb\">Improve payment timing and methods</span><span class=\"tr\"><i style=\"width:31.3%\"></i></span><span class=\"vl\">27%<small> (26)</small></span></div><div class=\"bl\"><span class=\"lb\">Make hours and earnings easier to track</span><span class=\"tr\"><i style=\"width:28.9%\"></i></span><span class=\"vl\">25%<small> (24)</small></span></div><div class=\"bl\"><span class=\"lb\">Support more phone models</span><span class=\"tr\"><i style=\"width:28.9%\"></i></span><span class=\"vl\">25%<small> (24)</small></span></div><div class=\"bl\"><span class=\"lb\">Make task instructions clearer</span><span class=\"tr\"><i style=\"width:26.5%\"></i></span><span class=\"vl\">23%<small> (22)</small></span></div><div class=\"bl\"><span class=\"lb\">Simplify video uploads</span><span class=\"tr\"><i style=\"width:21.7%\"></i></span><span class=\"vl\">19%<small> (18)</small></span></div><div class=\"bl\"><span class=\"lb\">Improve app and site stability</span><span class=\"tr\"><i style=\"width:18.1%\"></i></span><span class=\"vl\">15%<small> (15)</small></span></div><div class=\"bl\"><span class=\"lb\">Better communicate rule changes</span><span class=\"tr\"><i style=\"width:8.4%\"></i></span><span class=\"vl\">7%<small> (7)</small></span></div></div>"}, {"id": "vozes", "sec": "Open-ended responses", "t": "Open-ended responses reinforce the demand for predictability, transparency and compatibility", "h": "<div class=\"g3 qq\"><blockquote>“If you say you&#x27;ll pay on a given day, pay. Some platforms are losing a lot of credibility because of this.”</blockquote><blockquote>“More explanation about warnings and bans.”</blockquote><blockquote>“Visibility into hours, reviews and acceptances.”</blockquote><blockquote>“A guaranteed, stable hourly rate for a fixed period.”</blockquote><blockquote>“Accepting more phones for recording.”</blockquote><blockquote>“Fix the bug that keeps exiting the recording screen and makes us lose the video.”</blockquote></div><p class=\"nt\">Anonymous open-ended responses, translated from Portuguese.</p>"}, {"id": "conclusoes", "sec": "Key findings", "t": "Six findings should guide recorder acquisition and retention strategy", "h": "<div class=\"g3 ins\"><div><b>51%</b><h5>Entrenched leadership</h5><p>Hub.xyz leads on every criterion; Claru.ai holds a clear lead over the rest for second place.</p></div><div><b>62%</b><h5>Highest conversion</h5><p>Micro1 POV has limited reach (13 users) but the highest rate of adoption as a main platform.</p></div><div><b>12</b><h5>Payment without retention</h5><p>Flambra has been used by 43 respondents and was named best for payment 12 times, yet it is no one’s main platform.</p></div><div><b>79%</b><h5>Pix as the standard</h5><p>Preference for Pix in reais is dominant; only 2 respondents prefer cryptocurrency.</p></div><div><b>44%</b><h5>Processing visibility</h5><p>Delays before videos appear and difficulty tracking status (22%) are the leading technical problems.</p></div><div><b>79%</b><h5>A recent, fluid base</h5><p>Most have been recording for three months or less, and 65 use three or more platforms, which lowers switching costs.</p></div></div>"}, {"id": "recomendacoes", "sec": "Recommendations", "t": "We recommend prioritizing six areas, ordered by the impact recorders report", "h": "<table class=\"rt\"><thead><tr><th>#</th><th>Area</th><th>Rationale</th></tr></thead><tbody><tr><td>1</td><td>Predictable payment via Pix</td><td>A fixed payment calendar, a lower minimum withdrawal and Pix in reais address the three main financial complaints.</td></tr><tr><td>2</td><td>Operational transparency</td><td>Real-time status for uploads, the review queue and approved hours.</td></tr><tr><td>3</td><td>Continuous task supply</td><td>Retain household tasks (93%) and bonus tasks (78%) while expanding the catalog.</td></tr><tr><td>4</td><td>Justified rejections</td><td>26% complain of rejections without a clear reason; objective feedback reduces rework.</td></tr><tr><td>5</td><td>Device compatibility</td><td>24 respondents ask for support for more phone models, a barrier to entry.</td></tr><tr><td>6</td><td>Stable hourly rate</td><td>The number-one selection criterion (85%); changes should be communicated in advance.</td></tr></tbody></table>"}], "U": {"src": "Source: Treinadores de IA survey, n=97, Oct 2026", "cr": "Prepared by <a href=\"https://x.com/notaboutdollar\" target=\"_blank\" rel=\"noopener\">Dollar</a> · with support from Grok Bot", "title": "AI Training Platforms in Brazil", "sub": "How content recorders perceive pay, operations, payments and support", "kick": "Industry study · October 2026", "prep": "Prepared for", "date": "Date", "datev": "October 2026", "base": "Sample", "basev": "97 respondents,
