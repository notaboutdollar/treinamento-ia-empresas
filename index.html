<div><b class=\"k\">51%</b>A Hub.xyz lidera todos os critérios avaliados; a disputa real é pelo 2º lugar, onde a Claru.ai aparece com folga.</div>\n<div><b class=\"k\">62%</b>Micro1 POV tem pouco alcance (13 usuários), mas a maior conversão: quem testa, adota.</div>\n<div><b class=\"k\">0 → 12</b>Flambra: 43 já usaram, ninguém a tem como principal, mas 12 a citam como melhor pagamento.</div>\n<div><b class=\"k\">79%</b>preferem Pix em reais; só 2 preferem cripto.</div>\n<div><b class=\"k\">44%</b>citam demora para o vídeo aparecer no sistema; 22% não conseguem acompanhar o status.</div>\n<div><b class=\"k\">79%</b>gravam há no máximo 3 meses: público novo, que decide rápido e troca de plataforma com facilidade (65 usam 3 ou mais).</div></div>", "sec": 1}, {"lab": "Recomendações", "grp": "Pesquisa · Plataformas de treinamento de IA", "h": "<div class=\"kick\">Próximos passos</div><h2>Recomendações baseadas nos dados</h2><div class=\"ins\">\n<div><b>1. Pagamento previsível e em Pix.</b> Datas fixas, saque mínimo baixo e Pix em reais atacam as três maiores queixas de pagamento.</div>\n<div><b>2. Status em tempo real.</b> Mostrar quando o vídeo entrou, a fila de análise e as horas aprovadas.</div>\n<div><b>3. Oferta constante de tarefas.</b> Tarefas domésticas e com bônus são o núcleo (93% e 78%); manter as existentes e adicionar novas.</div>\n<div><b>4. Rejeições explicadas.</b> 26% reclamam de rejeições sem motivo claro; feedback objetivo reduz retrabalho.</div>\n<div><b>5. Mais celulares compatíveis.</b> 24 pessoas pedem; é barreira de entrada para um público majoritariamente novo.</div>\n<div><b>6. Valor/hora estável.</b> Valor por hora é o critério nº 1 de escolha (85%); comunicar mudanças com antecedência.</div></div>", "sec": 1}, {"lab": "Encerramento", "grp": "Pesquisa · Plataformas de treinamento de IA", "h": "<h1><span class=\"g\">Quem paga em dia e mostra o status, fica com o gravador.</span></h1><p class=\"lead\">Pesquisa com 97 gravadores brasileiros · Outubro de 2026 · Preparado para Ventimani.</p><p class=\"crb\">Desenvolvido por <a href=\"https://x.com/notaboutdollar\" target=\"_blank\" rel=\"noopener\">Dollar</a> · <img class=\"av\" src=\"assets/grok-bot.webp\" alt=\"\" width=\"14\" height=\"14\" style=\"width:16px;height:16px;border-radius:4px;border:1px solid #000;vertical-align:-3px;margin-right:5px\">Co-host: Grok Bot</p><div class=\"row\"><button class=\"cta alt\" data-go=\"0\">⌂ Voltar ao início</button></div>", "sec": 1}];

const els=[...document.querySelectorAll('.s')];let cur=0;
function go(n){n=Math.max(0,Math.min(S.length-1,n));cur=n;els.forEach((el,i)=>{el.classList.toggle('on',i==n);el.classList.toggle('prev',i<n)});
$('#bar').style.width=(n/(S.length-1)*100)+'%';$('#cnt').textContent=`${n+1}/${S.length}`;$('#sec').textContent=S[n].grp;

const ov=t=>{$('#ov').classList.toggle('on',t);if(t)$('#ovg a.cur')?.scrollIntoView({block:'center'})};
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-go]');if(a){go(+a.dataset.go);ov(false)}});

if(k.key=='o'||k.key=='O')ov(!o);else if(k.key=='Escape')ov(false);else if(o)return;
else if(['ArrowRight','PageDown',' '].includes(k.key)){k.preventDefault();go(cur+1)}else if(['ArrowLeft','PageUp'].includes(k.key))go(cur-1);else if(k.key=='Home')go(0);else if(k.key=='End')go(S.length-1)});
